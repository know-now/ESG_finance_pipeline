services:
  postgres_db:
    image: postgres:15-alpine
    container_name: esg_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: esg_finance_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  kafka:
    image: apache/kafka:3.7.0
    container_name: esg_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  scraper_app:
    build:
      context: . 
      dockerfile: scraper/Dockerfile
    container_name: esg_scraper_app
    env_file:
      - .env
    depends_on:
      - kafka
    volumes:
      - ./scraper:/app
  processor_app:
    build:
      context: .
      dockerfile: processor/Dockerfile
    container_name: esg_processor
    depends_on:
      - kafka
      - postgres_db
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2G
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: esg_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - postgres_db
    env_file:
      - .env
  minio:
    image: alpine:3.20
    container_name: esg_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: >
      sh -c "apk update && apk add --no-cache minio &&
      minio server /data --address=0.0.0.0:9000 --console-address=:9001"
    volumes:
      - ./minio_data:/data
  
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: esg_docker_proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

    # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.7.1
    container_name: esg_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlUkKD3NmZj9trIHWCEfFc=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=50000
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      - postgres_db
    command: bash -c "airflow db upgrade && airflow users create --role Admin --username admin --firstname admin --lastname admin --password admin && airflow webserver"

    #Airflow Scheduler
  airflow-scheduler:
      image: apache/airflow:2.7.1
      container_name: esg_airflow_scheduler
      environment: 
        - AIRFLOW__CORE__EXECUTOR=LocalExecutor
        - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
        - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlUkKD3NmZj9trIHWCEfFc=
        - AIRFLOW__CORE__LOAD_EXAMPLES=False
        - AIRFLOW_UID=50000
      volumes:
        - ./dags:/opt/airflow/dags
        - ./logs:/opt/airflow/logs
      depends_on:
        - postgres_db
        - airflow-webserver
        - docker-socket-proxy
      command: airflow scheduler





